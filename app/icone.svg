<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Meu Bolso</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="b" cx="0.3" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#16203d"/>
      <stop offset="1" stop-color="#05070d"/>
    </radialGradient>
  </defs>
  <!-- Fundo escuro com brilho -->
  <rect width="512" height="512" rx="112" fill="url(#b)"/>
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="url(#g)" stroke-opacity="0.5" stroke-width="4"/>
  <!-- Carteira -->
  <rect x="104" y="150" width="304" height="216" rx="40" fill="none" stroke="url(#g)" stroke-width="22"/>
  <path d="M104 206 H352 a28 28 0 0 1 28 28" fill="none" stroke="url(#g)" stroke-width="14" stroke-linecap="round" stroke-opacity="0.6"/>
  <!-- O fecho, como um chip -->
  <rect x="300" y="236" width="108" height="66" rx="20" fill="#05070d" stroke="url(#g)" stroke-width="16"/>
  <circle cx="338" cy="269" r="10" fill="#22d3ee"/>
  <!-- Trilhas de circuito -->
  <path d="M150 300 H220 L244 276 H272" fill="none" stroke="#22d3ee" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="150" cy="300" r="10" fill="#22d3ee"/>
  <path d="M150 330 H250" fill="none" stroke="#8b5cf6" stroke-width="10" stroke-linecap="round"/>
  <circle cx="250" cy="330" r="10" fill="#8b5cf6"/>
</svg>
