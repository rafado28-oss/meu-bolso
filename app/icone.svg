<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Meu Bolso</title>
  <!-- Fundo preto -->
  <rect width="512" height="512" rx="96" fill="#0b0b0b"/>
  <!-- Moeda dourada entrando no bolso -->
  <circle cx="256" cy="148" r="66" fill="#d4af37"/>
  <circle cx="256" cy="148" r="44" fill="none" stroke="#8a6d1d" stroke-width="10"/>
  <!-- Bolso (cobre a metade de baixo da moeda) -->
  <path d="M150 176 H362 V328 L256 392 L150 328 Z" fill="#0b0b0b" stroke="#d4af37" stroke-width="22" stroke-linejoin="round"/>
  <!-- Costura -->
